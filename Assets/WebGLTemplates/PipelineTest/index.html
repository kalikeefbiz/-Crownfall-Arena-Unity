<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Crownfall Arena</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e1a}
    body{display:flex;align-items:center;justify-content:center}
    canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #status{position:fixed;color:white;font:16px sans-serif;text-align:center;max-width:90%;pointer-events:none}
    #insets{position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);pointer-events:none}
    #brand{font:600 20px serif;letter-spacing:.2em;color:#dac296;margin-bottom:16px}
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="960" height="540" tabindex="0" aria-label="Crownfall Arena 3v3"></canvas>
  <div id="insets"></div>
  <div id="status" role="status"><div id="brand">CROWNFALL ARENA</div><span id="progress">Preparing the arena…</span></div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    const progressText = document.getElementById('progress');
    let unity;
    const receiver = 'Complete Crownfall 3v3 Match';
    function insets() {
      if (!unity) return;
      const s = getComputedStyle(document.getElementById('insets'));
      const width=canvas.clientWidth||1, height=canvas.clientHeight||1;
      unity.SendMessage(receiver,'SetBrowserInsets',[parseFloat(s.paddingLeft)/width,parseFloat(s.paddingTop)/height,parseFloat(s.paddingRight)/width,parseFloat(s.paddingBottom)/height].join(','));
    }
    function suspend(reason) { if(unity) unity.SendMessage(receiver,'SuspendBrowserInput',reason); }
    window.addEventListener('blur',()=>suspend('blur'));
    window.addEventListener('pagehide',()=>suspend('pagehide'));
    document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend('hidden');else insets();});
    window.addEventListener('orientationchange',()=>{suspend('orientation');requestAnimationFrame(insets);});
    window.addEventListener('resize',()=>{suspend('resize');requestAnimationFrame(insets);});
    if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>requestAnimationFrame(insets));
    canvas.addEventListener('touchcancel',()=>suspend('touchcancel'));
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    const script = document.createElement('script');
    script.src = 'Build/{{{ LOADER_FILENAME }}}';
    script.onerror = () => { status.textContent = 'Unity loader could not be downloaded.'; };
    script.onload = () => {
      createUnityInstance(canvas, {
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Crownfall',
        productName: 'Crownfall Arena',
        productVersion: '0.1.0',
        devicePixelRatio: 1,
        matchWebGLToCanvasSize: true
      }, progress => {
        progressText.textContent = 'Loading Unity ' + Math.round(progress * 100) + '%';
      }).then(instance => { unity=instance; status.hidden = true; canvas.focus(); insets(); })
        .catch(error => { status.textContent = 'Unity could not start: ' + error; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
