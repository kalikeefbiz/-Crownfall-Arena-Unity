<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Crownfall Unity Pipeline Test</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e1a}
    body{display:flex;align-items:center;justify-content:center}
    canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #status{position:fixed;color:white;font:16px sans-serif;text-align:center;max-width:90%;pointer-events:none}
    @media(orientation:portrait){canvas{height:56.25vw}}
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="960" height="540" tabindex="0" aria-label="Tap the cube to change its color and size"></canvas>
  <div id="status" role="status">Loading Unity…</div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    const script = document.createElement('script');
    script.src = 'Build/{{{ LOADER_FILENAME }}}';
    script.onerror = () => { status.textContent = 'Unity loader could not be downloaded.'; };
    script.onload = () => {
      createUnityInstance(canvas, {
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Crownfall',
        productName: 'Crownfall Unity Pipeline Test',
        productVersion: '0.0.1',
        devicePixelRatio: 1,
        matchWebGLToCanvasSize: true
      }, progress => {
        status.textContent = 'Loading Unity ' + Math.round(progress * 100) + '%';
      }).then(() => { status.hidden = true; canvas.focus(); })
        .catch(error => { status.textContent = 'Unity could not start: ' + error; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
