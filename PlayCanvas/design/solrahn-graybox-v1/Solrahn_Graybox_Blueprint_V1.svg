 crown, stands decorative only.</text><text x="50" y="991" class="label">PLAYTEST GATES: MOVEMENT TIMES · ROTATION OPTIONS · CAMERA / VISIBILITY · CP CONTROL · 3v3 BOUNDARIES · MOBILE FRAME TIME</text><text x="50" y="1022" class="small">PROPOSAL ONLY. Graybox measurements require testing against existing combat ranges, bot navigation and match pacing. Decorative structures must not become towers.</text></svg>