name: Publish isolated Solrahn playtest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crownfall-solrahn-goal-014
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/playcanvas-port'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: PlayCanvas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PlayCanvas/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Existing offline Goal 013 validate_glb.cjs uses CommonJS; it is not runtime code.
      - run: npx eslint src tests vite.config.ts
      - run: npm run fmt
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- tests/browser/solrahn.spec.ts tests/browser/arena.spec.ts --reporter=line
      - name: Record preview source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node -e 'require("fs").writeFileSync("dist/preview-source.json", JSON.stringify({source:process.env.SOURCE_SHA,map:"solrahn",productionReplaced:false})+"\n")'
      - name: Publish only the isolated preview subtree
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./PlayCanvas/dist
          publish_branch: gh-pages
          destination_dir: solrahn-goal-014
          keep_files: true
          force_orphan: false
          enable_jekyll: false
