name: Import Crownfall M0 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crownfall-m0-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard the source baseline
        run: git diff --exit-code da70f7285e9bb6507a2f44e0426328b3ca83c999 -- Assets Packages ProjectSettings
      - name: Extract source files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, stat, zipfile
          root = pathlib.Path.cwd().resolve()
          allowed = {'Assets', 'Packages', 'ProjectSettings', 'Docs', 'Tools', 'README.md', '.gitignore'}
          with zipfile.ZipFile('Crownfall-Unity-M0.zip') as archive:
              entries = archive.infolist()
              if len({i.filename for i in entries}) != len(entries):
                  raise SystemExit('Duplicate ZIP paths')
              if sum(i.file_size for i in entries) > 100_000_000:
                  raise SystemExit('Unexpected archive size')
              for item in entries:
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename:
                      raise SystemExit('Unsafe archive path')
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('Archive symlink rejected')
                  if not path.parts or path.parts[0] not in allowed or item.is_dir():
                      continue
                  target = root.joinpath(*path.parts)
                  if not target.resolve().is_relative_to(root):
                      raise SystemExit('Unsafe destination')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source without running Unity
        run: |
          python -m pip install -r Tools/requirements-static.txt
          python Tools/validate_m0.py
          git diff --check
      - name: Commit M0 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Packages ProjectSettings Docs Tools README.md .gitignore
          git diff --cached --quiet && exit 0
          git commit -m "Add Crownfall production M0 foundation and Kit presentation"
          git push origin HEAD:main
