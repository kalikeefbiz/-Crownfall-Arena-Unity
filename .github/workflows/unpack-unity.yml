name: Unpack Unity Pipeline Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Unity project
        run: |
          unzip -o Crownfall-Unity-Pipeline-Test-27371eb.zip
          rm Crownfall-Unity-Pipeline-Test-27371eb.zip

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Unity pipeline test project"
          git push
