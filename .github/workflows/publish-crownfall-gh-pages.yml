name: Publish Crownfall WebGL Branch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "webgl-hosted/**"
      - ".github/workflows/publish-crownfall-gh-pages.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify hosted WebGL build
        shell: bash
        run: |
          set -euo pipefail
          test -f webgl-hosted/index.html
          test -d webgl-hosted/Build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webgl-hosted
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

