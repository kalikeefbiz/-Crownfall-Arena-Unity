name: Validate Crownfall Current

on:
  push:
    branches: [main, browser-parity-unity]
    paths:
      - 'Assets/**'
      - 'Docs/Kit*Manifest.json'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/**'
      - '.github/workflows/validate-crownfall-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static Unity source validation
        shell: bash
        run: |
          python -m pip install -r Tools/requirements-m1-static.txt
          python Tools/validate_m1.py
          python Tools/validate_current_build.py
          python Tools/validate_production.py
          for file in ci/*.sh; do bash -n "$file"; done
          git diff --check

      - name: Verify current combat configuration
        shell: python
        run: |
          from pathlib import Path
          import json
          root = Path(".")
          manifest = json.loads((root/"Packages/manifest.json").read_text())
          assert manifest["dependencies"] == {
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
          }, manifest
          attack = (root/"Assets/Crownfall/Configuration/KitBasicAttack.asset").read_text()
          for needle in (
              "  range: 2.6\n",
              "  cooldown: 0.85\n",
              "  comboWindow: 1.25\n",
              "  - 85\n  - 105\n",
          ):
              assert needle in attack, needle
          tuning = (root/"Assets/Crownfall/Configuration/M0SummonerTuning.asset").read_text()
          assert "  moveSpeed: 5.2\n" in tuning
          scene = (root/"Assets/Scenes/M0.unity").read_text()
          assert "  kitHealth: 950\n  targetHealth: 1000\n  targetRadius: 0.52\n" in scene
          print("PASS: package manifest and current Kit/M1 serialized balance configuration.")

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and execute pure combat framework
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/crownfall-framework-tests"
          mkdir -p "$TMP"
          cp Assets/Crownfall/Combat/Core/*.cs "$TMP/"
          cp Assets/Editor/M1CombatTests.cs "$TMP/"
          cp Assets/Editor/CombatEconomyTests.cs "$TMP/"
          cp Assets/Editor/FirstRosterBalanceTests.cs "$TMP/"
          cp Assets/Editor/TerritorySurgeTests.cs "$TMP/"
          cat > "$TMP/Program.cs" <<'CS'
          using System;
          using Crownfall.Tests;

          public static class Program
          {
              public static int Main()
              {
                  try
                  {
                      int m1 = M1CombatTests.Run();
                      int economy = CombatEconomyTests.Run();
                      int roster = FirstRosterBalanceTests.Run();
                      int surge = TerritorySurgeTests.Run();
                      Console.WriteLine($"PASS: M1={m1}, Economy={economy}, Roster={roster}, Surge={surge}");
                      return 0;
                  }
                  catch (Exception error)
                  {
                      Console.Error.WriteLine(error);
                      return 1;
                  }
              }
          }
          CS
          cat > "$TMP/FrameworkTests.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
          </Project>
          XML
          dotnet run --project "$TMP/FrameworkTests.csproj" --configuration Release

      - name: Compile and exercise complete 3v3 matches
        run: python Tools/run_complete_match_tests.py

      - name: Type-check full runtime against verified Unity module references
        shell: bash
        run: |
          set -euo pipefail
          REFERENCE_DIR="$RUNNER_TEMP/unity-references"
          mkdir -p "$REFERENCE_DIR"
          curl -fsSL --retry 3 https://api.nuget.org/v3-flatcontainer/unityengine.modules/2021.3.33/unityengine.modules.2021.3.33.nupkg -o "$REFERENCE_DIR/modules.zip"
          python - "$REFERENCE_DIR" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          directory=Path(sys.argv[1])
          manifest=json.loads(Path('Tools/unity_reference_2021_3_33.json').read_text())
          assert hashlib.sha256((directory/'modules.zip').read_bytes()).hexdigest()==manifest['packageSha256']
          with zipfile.ZipFile(directory/'modules.zip') as archive: archive.extractall(directory)
          PY
          export CROWNFALL_UNITY_REFERENCE_DIR="$REFERENCE_DIR/lib/netstandard2.0"
          export CROWNFALL_UNITY_REFERENCE_VERSION=2021.3.33
          python Tools/compile_match_runtime.py
          # This is a real API compile, not a Unity 6000 Editor/player execution claim.
