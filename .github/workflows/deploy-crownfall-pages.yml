name: Deploy Crownfall WebGL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "webgl-hosted/**"
      - ".github/workflows/deploy-crownfall-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "crownfall-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify materialized WebGL build
        shell: bash
        run: |
          set -euo pipefail
          test -f webgl-hosted/index.html
          find webgl-hosted/Build -maxdepth 1 -type f -print

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webgl-hosted

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Triggered after Build 6 materialization
